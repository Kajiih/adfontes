[package]
name = "adfontes"
version.workspace = true
edition.workspace = true
description.workspace = true
readme = "README.md"
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
include = ["/LICENSE", "/README.md", "/src/**"]
default-run = "adfontes"
autobins = false

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-x86_64-unknown-linux-musl{ archive-suffix }"

[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-aarch64-unknown-linux-musl{ archive-suffix }"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[workspace]
members = [".", "crates/adfontes-py"]
default-members = ["."]

[workspace.package]
version = "0.3.0"
edition = "2024"
description = "Full-text academic and technical literature reader CLI and stdio MCP server for coding agents"
repository = "https://github.com/Kajiih/adfontes"
license = "MIT"
keywords = ["agent", "arxiv", "literature", "mcp", "research"]
categories = ["command-line-utilities", "development-tools", "science"]

[workspace.lints.clippy]
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
cargo = { level = "deny", priority = -1 }
dbg_macro = "deny"
expect_used = "deny"
multiple_crate_versions = "allow"
nursery = { level = "deny", priority = -1 }
panic = "deny"
pedantic = { level = "deny", priority = -1 }
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[workspace.lints.rust]
dead_code = "deny"
missing_docs = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
unsafe_code = "deny"
unused = { level = "deny", priority = -1 }
unused_qualifications = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"

[lib]
name = "adfontes"
path = "src/lib.rs"

[[bin]]
name = "adfontes"
path = "src/bin/adfontes.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
# TODO: Consider if this is the right level of abstraction that we need.
cssparser = "0.38"
cssparser-color = "0.6"
dunce = "1.0"
encoding_rs = "0.8"
flate2 = { version = "1.1", default-features = false, features = [
    "rust_backend"
] }
ipnet = "2.11"
lopdf = { version = "0.47", default-features = false }
mime = "0.3"
percent-encoding = "2.3"
pulldown-cmark = { version = "0.13", default-features = false }
reqwest = { version = "0.13", default-features = false, features = [
    "http2",
    "rustls-no-provider"
] }
roxmltree = "0.21"
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12"
] }
rustls-platform-verifier = "0.7"
scraper = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
strum = { version = "0.28", features = ["derive"] }
tar = { version = "0.4", default-features = false }
tempfile = "3.27"
thiserror = "2.0"
tokio = { version = "1", default-features = false, features = [
    "macros",
    "net",
    "rt",
    "sync",
    "time"
] }
url = "2.5"

[dev-dependencies]
indoc = "2.0"
insta = "1.49"
pretty_assertions = "1.4"
rstest = "0.28"
wiremock = "0.6"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", default-features = false, features = [
    "fs",
    "process",
    "std"
] }

[lints]
workspace = true

[profile.release]
# Preserve Mach-O linker ad-hoc LC_CODE_SIGNATURE on Apple Silicon binaries and cdylib wheels;
# Linux standalone binaries (`strip`) and Linux manylinux_2_28 wheels (`maturin --strip`) strip
# symbols explicitly in `.github/workflows/release.yml`.
lto = "fat"
